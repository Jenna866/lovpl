<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Pastelito</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* Canvas de la animación y matriz */
        .canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #canvas-matrix {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        #pinkboard {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Contenedor del video y reproductor (inicialmente oculto) */
        #video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #video-container video {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }

        /* Reproductor flotante inferior estilo Spotify/Apple Music */
        .music-player-bar {
            position: absolute;
            bottom: 20px;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 20;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .equalizer-img {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            object-fit: cover;
        }

        .song-title {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .control-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <!-- Elementos de la animación inicial -->
    <canvas id="canvas-matrix"></canvas>
    <canvas class="canvas"></canvas>
    <canvas id="pinkboard"></canvas>

    <!-- Contenedor del video y reproductor flotante -->
    <div id="video-container">
        <video id="final-video" src="./nombre.mp4" playsinline autoplay muted loop></video>
        
        <!-- Barra de reproducción inferior -->
        <div class="music-player-bar">
            <div class="player-info">
                <img src="./videoframe_14012.png" alt="Ecualizador" class="equalizer-img">
                <span class="song-title">Reproduciendo...</span>
            </div>
            <div class="player-controls">
                <button class="control-btn" id="play-pause-btn">⏸</button>
            </div>
        </div>
    </div>

    <!-- Audio de fondo -->
    <audio id="bg-audio" src="./POLLYPOCKET.mp3" preload="auto" loop></audio>

    <!-- Scripts de la animación con rutas relativas correctas -->
    <script src="./matrix.js"></script>
    <script src="./index.js"></script>
    <script src="./heart.js"></script>

    <!-- Temporizador automático para pasar de la animación al video (22 segundos totales) -->
    <script>
        setTimeout(function() {
            var canvasMatrix = document.getElementById('canvas-matrix');
            var pinkboard = document.getElementById('pinkboard');
            var mainCanvas = document.querySelector('.canvas');
            var videoContainer = document.getElementById('video-container');
            var finalVideo = document.getElementById('final-video');
            var bgAudio = document.getElementById('bg-audio');

            if (canvasMatrix) canvasMatrix.style.display = 'none';
            if (pinkboard) pinkboard.style.display = 'none';
            if (mainCanvas) mainCanvas.style.display = 'none';

            if (videoContainer && finalVideo) {
                videoContainer.style.display = 'flex';
                finalVideo.play().catch(function(e) { console.log(e); });
            }

            // Control de Play/Pause del reproductor inferior
            var playPauseBtn = document.getElementById('play-pause-btn');
            if (playPauseBtn && bgAudio) {
                playPauseBtn.addEventListener('click', function() {
                    if (bgAudio.paused) {
                        bgAudio.play();
                        playPauseBtn.textContent = '⏸';
                    } else {
                        bgAudio.pause();
                        playPauseBtn.textContent = '▶';
                    }
                });
            }
        }, 22000); // 22 segundos para la secuencia completa y los 4s del corazón
    </script>
</body>
</html>
